name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-core-manifest:
    name: Debug Core dependency and source ownership smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Validate SwiftPM manifest and split capture ownership
        run: |
          swift package dump-package > /tmp/ptools-debug-package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path("/tmp/ptools-debug-package.json").read_text())
          targets = {entry["name"]: entry for entry in package["targets"]}
          needed = ("PToolsDebugCore", "PToolsDebugMetricsCore", "PToolsDebugInspectorCore",
                    "PToolsDebugInventoryCore", "PToolsStudioProtocolCore", "PToolsDebugNetworkCore")
          for name in needed:
              assert name in targets, f"missing split target {name}"
          owner = targets["PToolsDebugNetworkCore"]
          files = {"DebugNetwork/PTNetworkCaptureModels.swift",
                   "DebugNetwork/PTNetworkCaptureStore.swift",
                   "DebugNetwork/PTNetworkRedactor.swift"}
          assert files == set(owner.get("sources", [])), "capture core source contract drift"
          debug = targets["PooToolsDEBUG"]
          assert files <= set(debug.get("exclude", [])), "duplicate canonical capture sources in DEBUG"
          for file in files:
              source = (Path("PooToolsSource") / file).read_text()
              assert "import UIKit" not in source and "import ptools" not in source, file
          # PR28/29: ownership remains one source per platform, while the
          # CocoaPods DEBUG aggregates exact source files only once.
          assert "PToolsDebugInspectorUI" in targets, "missing UIKit Inspector leaf"
          assert "PToolsDebugStorageCore" in targets, "missing Storage facade"
          storage = targets["PToolsDebugStorageCore"]
          assert set(storage.get("sources", [])) == {"PTDebugInventory.swift"}
          assert "Debug/PTDebugInventory.swift" in debug.get("exclude", [])
          assert "PToolsDebugStorageCore" in str(debug.get("dependencies", []))
          inspector = targets["PToolsDebugInspectorUI"]
          assert inspector.get("path") == "PooToolsSource/PToolsDebugInspectorUI"
          bridge = targets["PToolsDebugStudioBridge"]
          assert "PToolsDebugInspectorUI" in str(bridge.get("dependencies", []))
          assert "PToolsDebugStorageCore" in str(bridge.get("dependencies", []))
          assert "PTDebugEvent" not in (
              Path("PooToolsSource/Debug/PTDebugFunction.swift").read_text().split(
                  "// English: PTDebugManager owns registration"
              )[0]
          )
          assert "PToolsDebugInspectorLegacyUI" in targets
          assert targets["PToolsDebugInspectorLegacyUI"]["path"] == "PooToolsSource/Inspector"
          assert "Inspector" not in debug.get("sources", [])
          assert "PToolsDebugInspectorLegacyUI" in str(debug.get("dependencies", []))
          assert "PToolsDebugConsoleCore" in targets
          assert set(targets["PToolsDebugConsoleCore"].get("sources", [])) == {"PTDebugEvents.swift"}
          assert "PTDebugEvents.swift" in targets["PToolsDebugCore"].get("exclude", [])
          assert "PToolsDebugConsoleCore" in str(targets["PToolsDebugCore"].get("dependencies", []))
          assert "PTDebugTimelineGeometry.swift" in Path(
              "PooToolsSource/PToolsDebugMetricsCore/PTDebugTimelineGeometry.swift").name
          # PR36: NavigationBarManager implementation is physically split,
          # with exact SwiftPM and CocoaPods source parity and no rule waiver.
          navigation_sources = [
              Path("PooToolsSource/Base/PTNavigationBarManager.swift"),
              Path("PooToolsSource/Base/PTNavigationBarManagerSupport.swift"),
              Path("PooToolsSource/Base/PTNavigationBarManager+Components.swift")
          ]
          assert all(path.exists() for path in navigation_sources)
          assert max(len(path.read_text().splitlines()) for path in navigation_sources) < 2000
          assert "extension PTNavigationBarManager: UINavigationControllerDelegate" in navigation_sources[0].read_text()
          assert "class PTNavigationDelegateProxy" in navigation_sources[1].read_text()
          assert "func startDisplayLink()" in navigation_sources[2].read_text()
          pod = Path("PooTools.podspec").read_text()
          assert "PooToolsSource/Base/*.{h,m,swift}" in pod
          project = Path("PooTools.xcodeproj/project.pbxproj").read_text()
          assert all(path.name in project for path in navigation_sources)
          for name in ("PToolsDebugConsoleUI", "PToolsDebugMetricsUI"):
              assert name in targets, f"missing UI leaf target {name}"
              assert name in str(debug.get("dependencies", []))
          console_source = Path("PooToolsSource/PToolsDebugConsoleUI/PTConsoleWindow.swift").read_text()
          metrics_source = Path("PooToolsSource/PToolsDebugMetricsUI/PTDebugMetricsTrackRenderer.swift").read_text()
          legacy_console = Path("PooToolsSource/LocalConsole/LocalConsole.swift").read_text()
          assert "class PTConsoleWindow" in console_source
          assert "class PTConsoleWindow" not in legacy_console
          assert "PTConsoleWindow.onSceneDisconnect" in legacy_console
          assert "PTDebugMetricsTrackRenderer.drawTrackGrid" in Path("PooToolsSource/Debug/PTInstrumentsUI.swift").read_text()
          assert "PTInstrumentRecorder" not in metrics_source
          assert "PooToolsSource/PToolsDebugConsoleUI/**/*.swift" in pod
          assert "PooToolsSource/PToolsDebugMetricsUI/**/*.swift" in pod
          # swiftc parser verifies source-level syntax even when Linux has no UIKit SDK.
          import subprocess
          result = subprocess.run([
              "swiftc", "-frontend", "-parse",
              *[str(path) for path in navigation_sources]
          ], capture_output=True, text=True)
          assert result.returncode == 0, result.stderr
          print("PASS: PR36 three-file navigation Swift syntax parses on Linux")
          print("PASS: PR38/39 Console and Metrics UIKit leaves have unique source owners")
          print("PASS: PR36 NavigationBar split is below file limit; sources are registered")
          print("PASS: unique Network, Storage, Inspector UI and Console ownership")
          PY

  debug-foundation-compile:
    name: Swift 6 Foundation Debug/Storage/Console compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Compile actual Debug Core modules with Swift 6
        run: |
          set -euo pipefail
          mkdir -p /tmp/ptools-debug-modules
          swiftc -swift-version 6 -emit-module -module-name PToolsDebugConsoleCore \
            PooToolsSource/PToolsDebugCore/PTDebugEvents.swift \
            -emit-module-path /tmp/ptools-debug-modules/PToolsDebugConsoleCore.swiftmodule
          swiftc -swift-version 6 -D SWIFT_PACKAGE \
            -I /tmp/ptools-debug-modules -emit-module -module-name PToolsDebugCore \
            PooToolsSource/PToolsDebugCore/PTDebugSessionOwnerLedger.swift \
            PooToolsSource/PToolsDebugCore/PTDebugConsoleExports.swift \
            -emit-module-path /tmp/ptools-debug-modules/PToolsDebugCore.swiftmodule
          swiftc -swift-version 6 -emit-module -module-name PToolsDebugMetricsCore \
            PooToolsSource/PToolsDebugMetricsCore/*.swift \
            -emit-module-path /tmp/ptools-debug-modules/PToolsDebugMetricsCore.swiftmodule
          swiftc -swift-version 6 -emit-module -module-name PToolsDebugInventoryCore \
            PooToolsSource/PToolsDebugInventoryCore/*.swift \
            -emit-module-path /tmp/ptools-debug-modules/PToolsDebugInventoryCore.swiftmodule
          swiftc -swift-version 6 -D SWIFT_PACKAGE \
            -I /tmp/ptools-debug-modules -emit-module -module-name PToolsDebugStorageCore \
            PooToolsSource/Debug/PTDebugInventory.swift \
            -emit-module-path /tmp/ptools-debug-modules/PToolsDebugStorageCore.swiftmodule
          echo "PASS: Foundation Debug, Metrics, Inventory and Storage modules compile"

  inspector-ios-compat:
    name: iOS 17+ Inspector physical-target compile (Xcode compatibility)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Print Apple SDK and Swift toolchain versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
      - name: Typecheck extracted UIKit Inspector, Console and Metrics leaves
        run: |
          swift package dump-package >/dev/null
          swift build --triple arm64-apple-ios17.0-simulator --target PToolsDebugInspectorLegacyUI
          swift build --triple arm64-apple-ios17.0-simulator --target PToolsDebugConsoleUI
          swift build --triple arm64-apple-ios17.0-simulator --target PToolsDebugMetricsUI
      - name: Compile original Debug umbrella compatibility
        run: |
          swift build --triple arm64-apple-ios17.0-simulator --target PooToolsDEBUG

  debug-governance-repro:
    name: Generator-owned reports reproducibility (Linux diagnostics)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CocoaPods report parser
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Compare actual generator outputs against committed reports
        run: |
          bash Scripts/Governance/generate_all_current_reports.sh --check
      - name: Upload reproducibility diagnostics
        if: failure()
        run: |
          git status --short
          git diff --check

  version-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Version Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh version
      - name: Upload Version Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-version
          path: .quality-report

          include-hidden-files: true
  docs-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Documentation Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh docs
      - name: Upload Docs Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-docs
          path: .quality-report

          include-hidden-files: true
  font-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Font Catalog Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh font
      - name: Upload Font Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-font
          path: .quality-report

          include-hidden-files: true
  architecture-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Architecture Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh architecture
      - name: Upload Architecture Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-architecture
          path: .quality-report

          include-hidden-files: true
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Unit Tests
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh tests
      - name: Upload Tests Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-tests
          path: .quality-report

          include-hidden-files: true
  strict-concurrency:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_cocoapods.sh
      - name: Strict Concurrency
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh concurrency
      - name: Upload Concurrency Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-concurrency
          path: .quality-report

          include-hidden-files: true
  cocoapods:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_quality_environment.sh --cocoapods
      - name: CocoaPods
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh pods
      - name: Upload CocoaPods Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pods
          path: .quality-report

          include-hidden-files: true
  xcode-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_cocoapods.sh
      - name: Xcode Build
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh xcode
      - name: Upload Xcode Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-xcode
          path: .quality-report

          include-hidden-files: true
  release-metadata:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Release Metadata
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh release
      - name: Upload Release Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release
          path: .quality-report

          include-hidden-files: true
  quality-summary:
    if: always()
    needs:
      - version-governance
      - docs-governance
      - example-governance
      - font-governance
      - architecture-governance
      - unit-tests
      - strict-concurrency
      - governance
      - cocoapods
      - xcode-build
      - release-metadata
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Download Gate reports
        uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality-reports
          include-hidden-files: true
          merge-multiple: false
      - name: Final Quality Summary
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-reports" bash Scripts/CI/quality_gate.sh summary
      - name: Upload Quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-final-report
          path: .quality-reports

          include-hidden-files: true
  example-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Example Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh example
      - name: Upload Example Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-example
          path: .quality-report

          include-hidden-files: true
  governance:
    runs-on: macos-26
