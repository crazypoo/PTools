          name: quality-release
          path: .quality-report

          include-hidden-files: true
  quality-summary:
    if: always()
    needs:
      - version-governance
      - docs-governance
      - example-governance
      - font-governance
      - architecture-governance
      - unit-tests
      - strict-concurrency
      - governance
      - cocoapods
      - xcode-build
      - release-metadata
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Download Gate reports
        uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality-reports
          include-hidden-files: true
          merge-multiple: false
      - name: Final Quality Summary
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-reports" bash Scripts/CI/quality_gate.sh summary
      - name: Upload Quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-final-report
          path: .quality-reports

          include-hidden-files: true
  example-governance:
    runs-on: macos-26
