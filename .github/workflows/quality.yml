name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  version-governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Version Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh version
      - name: Upload Version Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-version
          path: .quality-report

  docs-governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Documentation Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh docs
      - name: Upload Docs Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-docs
          path: .quality-report

  font-governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Font Catalog Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh font
      - name: Upload Font Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-font
          path: .quality-report

  architecture-governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Architecture Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh architecture
      - name: Upload Architecture Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-architecture
          path: .quality-report

  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Unit Tests
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh tests
      - name: Upload Tests Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-tests
          path: .quality-report

  strict-concurrency:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_cocoapods.sh
      - name: Strict Concurrency
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh concurrency
      - name: Upload Concurrency Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-concurrency
          path: .quality-report

  cocoapods:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_quality_environment.sh --cocoapods
      - name: CocoaPods
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh pods
      - name: Upload CocoaPods Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-pods
          path: .quality-report

  xcode-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare CocoaPods
        run: bash Scripts/CI/prepare_cocoapods.sh
      - name: Xcode Build
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh xcode
      - name: Upload Xcode Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-xcode
          path: .quality-report

  release-metadata:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Release Metadata
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh release
      - name: Upload Release Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-release
          path: .quality-report

  quality-summary:
    if: always()
    needs:
      - version-governance
      - docs-governance
      - example-governance
      - font-governance
      - architecture-governance
      - unit-tests
      - strict-concurrency
      - governance
      - cocoapods
      - xcode-build
      - release-metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Download Gate reports
        uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          path: .quality-reports
          merge-multiple: false
      - name: Final Quality Summary
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-reports" bash Scripts/CI/quality_gate.sh summary
      - name: Upload Quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-final-report
          path: .quality-reports

  example-governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Example Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh example
      - name: Upload Example Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-example
          path: .quality-report

  governance:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh governance
      - name: Upload Governance Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-governance
          path: .quality-report
