name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-core-manifest:
    name: Debug Core dependency and source ownership smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Validate SwiftPM manifest and split capture ownership
        run: |
          swift package dump-package > /tmp/ptools-debug-package.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          package = json.loads(Path("/tmp/ptools-debug-package.json").read_text())
          targets = {entry["name"]: entry for entry in package["targets"]}
          needed = ("PToolsDebugCore", "PToolsDebugMetricsCore", "PToolsDebugInspectorCore",
                    "PToolsDebugInventoryCore", "PToolsStudioProtocolCore", "PToolsDebugNetworkCore")
          for name in needed:
              assert name in targets, f"missing split target {name}"
          owner = targets["PToolsDebugNetworkCore"]
          files = {"DebugNetwork/PTNetworkCaptureModels.swift",
                   "DebugNetwork/PTNetworkCaptureStore.swift",
                   "DebugNetwork/PTNetworkRedactor.swift"}
          assert files == set(owner.get("sources", [])), "capture core source contract drift"
          debug = targets["PooToolsDEBUG"]
          assert files <= set(debug.get("exclude", [])), "duplicate canonical capture sources in DEBUG"
          for file in files:
              source = (Path("PooToolsSource") / file).read_text()
              assert "import UIKit" not in source and "import ptools" not in source, file
          # PR28/29: ownership remains one source per platform, while the
          # CocoaPods DEBUG aggregates exact source files only once.
          assert "PToolsDebugInspectorUI" in targets, "missing UIKit Inspector leaf"
          assert "PToolsDebugStorageCore" in targets, "missing Storage facade"
          storage = targets["PToolsDebugStorageCore"]
          assert set(storage.get("sources", [])) == {"PTDebugInventory.swift"}
          assert "Debug/PTDebugInventory.swift" in debug.get("exclude", [])
          assert "PToolsDebugStorageCore" in str(debug.get("dependencies", []))
          inspector = targets["PToolsDebugInspectorUI"]
          assert inspector.get("path") == "PooToolsSource/PToolsDebugInspectorUI"
          bridge = targets["PToolsDebugStudioBridge"]
          assert "PToolsDebugInspectorUI" in str(bridge.get("dependencies", []))
          assert "PToolsDebugStorageCore" in str(bridge.get("dependencies", []))
          assert "PTDebugEvent" not in (
              Path("PooToolsSource/Debug/PTDebugFunction.swift").read_text().split(
                  "// English: PTDebugManager owns registration"
              )[0]
          )
          print("PASS: unique Network, Storage, Inspector UI and Console ownership")
          PY

  version-governance:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare quality tools
        run: bash Scripts/CI/prepare_quality_environment.sh
      - name: Version Governance
        run: QUALITY_REPORT_DIR="$GITHUB_WORKSPACE/.quality-report" bash Scripts/CI/quality_gate.sh version
      - name: Upload Version Gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-version
          path: .quality-report

          include-hidden-files: true
  docs-governance:
