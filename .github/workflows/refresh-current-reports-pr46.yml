name: Refresh Generated Current Reports
on:
  workflow_dispatch:
  push:
    branches:
      - feature/pr46-pr50-inspector-layout-governance-20261030
      - feature/pr51-pr55-debug-performance-rel-candidate-20261030
      - feature/pr56-pr60-rc-ci-security-20261030

permissions:
  contents: write

concurrency:
  group: pr46-current-report-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-current:
    name: Regenerate and commit source-of-truth reports
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install required report tools
        run: sudo gem install cocoapods -v 1.16.2 --no-document
      - name: Regenerate from canonical generators
        run: |
          set -euo pipefail
          bash Scripts/Governance/generate_all_current_reports.sh --write
          git diff --check
          bash Scripts/Governance/generate_all_current_reports.sh --check
      - name: Commit generated files only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- report/current
          if git diff --cached --quiet; then
            echo "Current reports are already reproducible."
            exit 0
          fi
          echo "Committing ONLY generator-produced report/current changes."
          git diff --cached --stat
          git commit -m "chore(governance): regenerate current reports from canonical generators"
          git push origin HEAD:"${GITHUB_REF_NAME}"
