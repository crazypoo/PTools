name: Device Catalog Watch

on:
  schedule:
    - cron: '30 2 * * 1'
  workflow_dispatch:

jobs:
  validate-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate source catalog
        run: python3 Scripts/Device/validate_device_catalog.py
      - name: Check generated catalog
        run: python3 Scripts/Device/diff_device_catalog.py
      - name: Upload catalog sources
        uses: actions/upload-artifact@v4
        with:
          name: ptools-device-catalog
          path: |
            PooToolsSource/PToolsDevice/Resources/DeviceCatalog/*.json
            PooToolsSource/PToolsDevice/Generated/*.swift
