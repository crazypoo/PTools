name: PTools 6.0 Governance Refresh

on:
  push:
    branches:
      - fix/6-preflight-05-governance-refresh-20261029
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'crazypoo/PTools'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run canonical document and current-report generators
        run: bash Scripts/Governance/refresh_release_candidate.sh
      - name: Commit only verified generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_meta docs/index docs/modules docs/maintenance docs/README.md docs/reports report/current report/docs report/scripts report/data report/tests
          if ! git diff --cached --quiet; then
            git commit -m "docs(governance): regenerate canonical assets at current source digest"
            git push origin HEAD:refs/heads/fix/6-preflight-05-governance-refresh-20261029
          fi
      - name: Summarize regeneration
        if: always()
        run: git status --short
